<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <title>4.후손 선택자와 자손 선택자</title>
    <style>
        table > tr > th{color:red;}
    </style>
</head>
<body>
    <h2>4.후손 선택자와 자손 선택자</h2>
    <h3>4.2자손 선택자</h3>
    <p>주의! table태그에 스타일을 적용할 때는 자손 선택자를 사용하면 안됨.</p> <!--tbody 태그가 생겨서 자손이 다른걸로 됌.-->

    <table border="1">
        <tr>
            <th>이름</th>
            <th>지역</th>
        </tr>
        <tr>
            <td>김유상</td>
            <td>서울</td>
        </tr>
    </table>
</body>
